<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rewake Development Documentation</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: #101827; color: #f8fafc; font: 16px/1.5 system-ui, sans-serif; }
      main { width: min(560px, calc(100% - 40px)); }
      h1 { font-size: clamp(2rem, 6vw, 3rem); line-height: 1.1; }
      nav { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
      a { padding: 24px; border-radius: 14px; background: #23324b; color: inherit;
        font-size: 1.25rem; font-weight: 700; text-align: center; text-decoration: none; }
      a:hover, a:focus-visible { background: #315078; }
    </style>
  </head>
  <body>
    <main>
      <h1>Rewake Development Documentation</h1>
      <p>Choose a language:</p>
      <nav aria-label="Documentation language">
        <a href="./en/">English</a>
        <a href="./fr/">Français</a>
      </nav>
    </main>
  </body>
</html>
